[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout-mcp"
version = "0.1.0"
description = "MCP server + LangGraph agent for AI/ML job-market analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ruturaj Bhosale" }]
dependencies = [
    "mcp>=1.9",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-openai>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
jobscout = "jobscout.cli:main"
jobscout-server = "jobscout.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
